server {
    listen       8080;
    server_name  _;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root   /usr/share/nginx/html;
    index  index.html;

    # ES modules must be served as JavaScript; an empty types block in the
    # location clears inherited mappings so default_type is authoritative.
    location ~ \.js$ {
        types { }
        default_type "text/javascript; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"cert-chain-review"}';
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
